name: lab-report

# Judges the `findings-*` artifacts of the calling run with PyTorch and files an issue per finding.
# The caller grants `issues: write`.
on:
  workflow_call:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: findings-*
          path: findings

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Judge every finding with PyTorch
        env:
          UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          shopt -s nullglob globstar
          programs=(findings/**/*.program.json)
          if [ ${#programs[@]} -gt 0 ]; then
            uv run crates/burn-inference-tests/ci/oracle.py "${programs[@]}" | tee verdicts.jsonl
          fi

      - name: File or update an issue per finding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: crates/burn-inference-tests/ci/report-findings.sh findings
