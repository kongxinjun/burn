name: lab-functional

on:
  push:
    branches: [lab]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      burn-ref:
        description: Upstream branch, tag or commit to test
        default: main

concurrency:
  group: lab-functional-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BURN_LAB_MODELS: ${{ github.workspace }}/lab-models
  DISABLE_WGPU_SPIRV: "1"

jobs:
  models:
    uses: ./.github/workflows/lab-models.yml

  test:
    name: test (${{ matrix.name }})
    needs: models
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: flex, os: ubuntu-24.04, features: "" }
          # Hosted macOS runners have a paravirtual GPU without Metal 3, which CubeCL requires:
          # macOS covers Flex on Apple CPUs here, and Metal runs in lab-metal on your own Mac.
          - { name: flex macos, os: macos-15, features: "" }
          - { name: cpu+fusion, os: ubuntu-24.04, features: "cpu,fusion" }
          - { name: cpu, os: ubuntu-24.04, features: "cpu" }
          # lavapipe caps storage buffers at 128 MiB, below distilgpt2's 147 MiB output layer.
          - { name: wgpu+fusion lavapipe, os: ubuntu-24.04, features: "wgpu,fusion", lavapipe: true, skip: distilgpt2 }
          - { name: wgpu lavapipe, os: ubuntu-24.04, features: "wgpu", lavapipe: true, skip: distilgpt2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the lavapipe software Vulkan driver
        if: matrix.lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary

      - uses: ./.github/actions/lab-setup
        with:
          burn-ref: ${{ inputs.burn-ref || 'main' }}
          cache-key: ${{ matrix.name }}
          models: "true"

      - name: Small models
        working-directory: upstream/crates/burn-inference-tests
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo test --release --test inference --features "$FEATURES"

      - name: Pretrained models
        if: success() || failure()
        working-directory: upstream/crates/burn-inference-tests
        env:
          FEATURES: ${{ matrix.features }}
          LAB_SKIP: ${{ matrix.skip }}
        run: cargo test --release --test zoo --features "$FEATURES"

      # Steps allowed to fail: each tracks a confirmed problem and starts passing once it is fixed.
      - name: "Known limitation: tests skipped on this runner"
        if: matrix.skip
        continue-on-error: true
        working-directory: upstream/crates/burn-inference-tests
        env:
          FEATURES: ${{ matrix.features }}
          SKIPPED: ${{ matrix.skip }}
        run: cargo test --release --test zoo --features "$FEATURES" -- "$SKIPPED"

      - name: "Known upstream bugs"
        if: matrix.features != ''
        continue-on-error: true
        working-directory: upstream/crates/burn-inference-tests
        env:
          FEATURES: ${{ matrix.features }}
        run: cargo test --release --test known_bugs --features "$FEATURES"
