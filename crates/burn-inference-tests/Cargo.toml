[package]
description = "End-to-end inference tests for Burn models"
edition.workspace = true
license.workspace = true
name = "burn-inference-tests"
publish = false
readme = "README.md"
version.workspace = true

[lints]
workspace = true

[features]
default = []
cpu = ["burn/cpu"]
cuda = ["burn/cuda"]
fusion = ["burn/fusion"]
metal = ["burn/metal"]
wgpu = ["burn/wgpu"]

[dependencies]
# Not `default`: it enables fusion on every CubeCL backend, which the `fusion` feature controls here.
burn = { workspace = true, features = ["autotune", "flex", "rayon", "simd", "std"] }
burn-store = { workspace = true, features = ["std", "safetensors"] }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
safetensors = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }

[[test]]
harness = false
name = "inference"

[[test]]
harness = false
name = "zoo"

[[test]]
harness = false
name = "known_bugs"
